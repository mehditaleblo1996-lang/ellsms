########################################################################
# ELLSMS — connects to the SAME MySQL database and Docker network as
# the connected backend SMS platform. This stack does NOT run its own
# MySQL — bring up the backend's own stack first so that its network
# and database already exist, then bring this one up.
#
# BACKEND_NETWORK must match the Docker network name the backend's own
# docker-compose.yml created (an "external" network here just means
# "already exists, created by someone else" — it is not published or
# owned by ELLSMS).
########################################################################
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ellsms-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_URL: ${APP_URL:-}
      APP_VERSION: ${APP_VERSION:-}
      SMS_GATEWAY_TRANSPORT: ${SMS_GATEWAY_TRANSPORT:-0}
      ELLSMS_MOCK_GATEWAY_ENABLED: ${ELLSMS_MOCK_GATEWAY_ENABLED:-0}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      SESSION_ABSOLUTE_TIMEOUT_SECONDS: ${SESSION_ABSOLUTE_TIMEOUT_SECONDS:-43200}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-900}
      RATE_LIMIT_2FA_VERIFY_MAX: ${RATE_LIMIT_2FA_VERIFY_MAX:-10}
      RATE_LIMIT_2FA_VERIFY_WINDOW_SECONDS: ${RATE_LIMIT_2FA_VERIFY_WINDOW_SECONDS:-900}
      RATE_LIMIT_2FA_RESEND_MAX: ${RATE_LIMIT_2FA_RESEND_MAX:-5}
      RATE_LIMIT_2FA_RESEND_WINDOW_SECONDS: ${RATE_LIMIT_2FA_RESEND_WINDOW_SECONDS:-3600}
      RATE_LIMIT_API_SEND_MAX: ${RATE_LIMIT_API_SEND_MAX:-30}
      RATE_LIMIT_API_SEND_WINDOW_SECONDS: ${RATE_LIMIT_API_SEND_WINDOW_SECONDS:-300}
      BACKEND_DB_HOST: ${BACKEND_DB_HOST:?set BACKEND_DB_HOST in .env}
      BACKEND_DB_PORT: ${BACKEND_DB_PORT:-3306}
      BACKEND_DB_NAME: ${BACKEND_DB_NAME:?set BACKEND_DB_NAME in .env}
      BACKEND_DB_USER: ${BACKEND_DB_USER:?set BACKEND_DB_USER in .env}
      BACKEND_DB_PASS: ${BACKEND_DB_PASS:?set BACKEND_DB_PASS in .env}
      BACKEND_DB_SSL_VERIFY: ${BACKEND_DB_SSL_VERIFY:-0}
      BACKEND_DB_SSL_CA: ${BACKEND_DB_SSL_CA:-}
      API_BASE_URL: ${API_BASE_URL:-}
      BACKEND_SERVICE_ID: ${BACKEND_SERVICE_ID:-}
      BACKEND_SERVICE_SECRET: ${BACKEND_SERVICE_SECRET:-}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-0}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Unified alerting (issue #15) — see .env.example for defaults.
      ALERT_REPEAT_SECONDS_WARNING: ${ALERT_REPEAT_SECONDS_WARNING:-}
      ALERT_REPEAT_SECONDS_CRITICAL: ${ALERT_REPEAT_SECONDS_CRITICAL:-}
      ALERT_REPEAT_SECONDS_EMERGENCY: ${ALERT_REPEAT_SECONDS_EMERGENCY:-}
      ALERT_EMAIL_RECIPIENT: ${ALERT_EMAIL_RECIPIENT:-}
      # Public API / webhooks (Phase 12) — OFF by default, see .env.example.
      API_ENABLED: ${API_ENABLED:-0}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-60}
      API_RATE_LIMIT_BURST: ${API_RATE_LIMIT_BURST:-15}
      API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES:-262144}
      API_MAX_BULK_ITEMS: ${API_MAX_BULK_ITEMS:-5000}
      API_IDEMPOTENCY_TTL_HOURS: ${API_IDEMPOTENCY_TTL_HOURS:-48}
      WEBHOOK_MASTER_KEY: ${WEBHOOK_MASTER_KEY:-}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-10}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-8}
      WEBHOOK_MAX_RESPONSE_BYTES: ${WEBHOOK_MAX_RESPONSE_BYTES:-4096}
      WEBHOOK_REQUIRE_HTTPS: ${WEBHOOK_REQUIRE_HTTPS:-1}
      # Plans/subscriptions/quotas (Phase 13) — OFF by default, see .env.example.
      BILLING_ENABLED: ${BILLING_ENABLED:-0}
      DEFAULT_PLAN_CODE: ${DEFAULT_PLAN_CODE:-free}
      SUBSCRIPTION_GRACE_DAYS: ${SUBSCRIPTION_GRACE_DAYS:-7}
      SUBSCRIPTION_JOB_BATCH_SIZE: ${SUBSCRIPTION_JOB_BATCH_SIZE:-200}
      USAGE_RESERVATION_TTL_MINUTES: ${USAGE_RESERVATION_TTL_MINUTES:-60}
      BILLING_CURRENCY: ${BILLING_CURRENCY:-IRR}
      # Financial commerce (docs/financial-commerce.md) — invoices, tax, payment gateway
      # abstraction. ELLSMS_FAKE_PAYMENT_GATEWAY_ENABLED must stay 0 in production.
      BILLING_TAX_PERCENT: ${BILLING_TAX_PERCENT:-0}
      PAYMENT_DEFAULT_GATEWAY: ${PAYMENT_DEFAULT_GATEWAY:-zarinpal}
      ELLSMS_FAKE_PAYMENT_GATEWAY_ENABLED: ${ELLSMS_FAKE_PAYMENT_GATEWAY_ENABLED:-0}
    volumes:
      - ./:/var/www/html
    networks:
      - backend_net

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ellsms-worker
    restart: unless-stopped
    command: php /var/www/html/cron/worker.php
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_VERSION: ${APP_VERSION:-}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-8}
      WORKER_JOB_LEASE_SECONDS: ${WORKER_JOB_LEASE_SECONDS:-300}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-5}
      JOB_RETRY_BASE_SECONDS: ${JOB_RETRY_BASE_SECONDS:-30}
      JOB_RETRY_MAX_SECONDS: ${JOB_RETRY_MAX_SECONDS:-1800}
      ELLSMS_MOCK_GATEWAY_ENABLED: ${ELLSMS_MOCK_GATEWAY_ENABLED:-0}
      # Phase 13 — the worker enforces subscription state at execution time (a suspended
      # organization's queued job must not keep sending), so it needs the same billing config.
      BILLING_ENABLED: ${BILLING_ENABLED:-0}
      DEFAULT_PLAN_CODE: ${DEFAULT_PLAN_CODE:-free}
      SUBSCRIPTION_GRACE_DAYS: ${SUBSCRIPTION_GRACE_DAYS:-7}
      SUBSCRIPTION_JOB_BATCH_SIZE: ${SUBSCRIPTION_JOB_BATCH_SIZE:-200}
      USAGE_RESERVATION_TTL_MINUTES: ${USAGE_RESERVATION_TTL_MINUTES:-60}
      BILLING_CURRENCY: ${BILLING_CURRENCY:-IRR}
      # Financial commerce (docs/financial-commerce.md) — cron/payments-reconcile.php runs from
      # this container and needs the same gateway/tax config the app container uses.
      BILLING_TAX_PERCENT: ${BILLING_TAX_PERCENT:-0}
      PAYMENT_DEFAULT_GATEWAY: ${PAYMENT_DEFAULT_GATEWAY:-zarinpal}
      ELLSMS_FAKE_PAYMENT_GATEWAY_ENABLED: ${ELLSMS_FAKE_PAYMENT_GATEWAY_ENABLED:-0}
      BACKEND_DB_HOST: ${BACKEND_DB_HOST:?set BACKEND_DB_HOST in .env}
      BACKEND_DB_PORT: ${BACKEND_DB_PORT:-3306}
      BACKEND_DB_NAME: ${BACKEND_DB_NAME:?set BACKEND_DB_NAME in .env}
      BACKEND_DB_USER: ${BACKEND_DB_USER:?set BACKEND_DB_USER in .env}
      BACKEND_DB_PASS: ${BACKEND_DB_PASS:?set BACKEND_DB_PASS in .env}
      BACKEND_DB_SSL_VERIFY: ${BACKEND_DB_SSL_VERIFY:-0}
      BACKEND_DB_SSL_CA: ${BACKEND_DB_SSL_CA:-}
      API_BASE_URL: ${API_BASE_URL:-}
      BACKEND_SERVICE_ID: ${BACKEND_SERVICE_ID:-}
      BACKEND_SERVICE_SECRET: ${BACKEND_SERVICE_SECRET:-}
      # Provider-health alerts (issue #16) can fire from this process via issue #15's unified
      # alerting -- without these, a real outage detected here never reaches an admin.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_REPEAT_SECONDS_WARNING: ${ALERT_REPEAT_SECONDS_WARNING:-}
      ALERT_REPEAT_SECONDS_CRITICAL: ${ALERT_REPEAT_SECONDS_CRITICAL:-}
      ALERT_REPEAT_SECONDS_EMERGENCY: ${ALERT_REPEAT_SECONDS_EMERGENCY:-}
      ALERT_EMAIL_RECIPIENT: ${ALERT_EMAIL_RECIPIENT:-}
    volumes:
      - ./:/var/www/html
    networks:
      - backend_net
    # Give the worker time to finish its current pass and exit cleanly
    # (see cron/worker.php's SIGTERM handling) before Docker sends SIGKILL.
    stop_grace_period: 30s

  # Phase 12, STEP 33 — deliberately its OWN container, never sharing worker's poll loop: a slow or
  # unreachable customer webhook endpoint can only ever delay OTHER webhook deliveries this way,
  # never a scheduled send/auto-reply/bulk-send pass. Also used by `make webhook-worker-once` for a
  # single throwaway pass (safe to run alongside this persistent service — same atomic-claim
  # guarantee as every other Phase 4-style claim query in this project).
  webhook-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ellsms-webhook-worker
    restart: unless-stopped
    command: php /var/www/html/cron/webhook-worker.php
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_VERSION: ${APP_VERSION:-}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-8}
      JOB_RETRY_BASE_SECONDS: ${JOB_RETRY_BASE_SECONDS:-30}
      JOB_RETRY_MAX_SECONDS: ${JOB_RETRY_MAX_SECONDS:-1800}
      BACKEND_DB_HOST: ${BACKEND_DB_HOST:?set BACKEND_DB_HOST in .env}
      BACKEND_DB_PORT: ${BACKEND_DB_PORT:-3306}
      BACKEND_DB_NAME: ${BACKEND_DB_NAME:?set BACKEND_DB_NAME in .env}
      BACKEND_DB_USER: ${BACKEND_DB_USER:?set BACKEND_DB_USER in .env}
      BACKEND_DB_PASS: ${BACKEND_DB_PASS:?set BACKEND_DB_PASS in .env}
      BACKEND_DB_SSL_VERIFY: ${BACKEND_DB_SSL_VERIFY:-0}
      BACKEND_DB_SSL_CA: ${BACKEND_DB_SSL_CA:-}
      WEBHOOK_MASTER_KEY: ${WEBHOOK_MASTER_KEY:-}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-10}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-8}
      WEBHOOK_MAX_RESPONSE_BYTES: ${WEBHOOK_MAX_RESPONSE_BYTES:-4096}
      WEBHOOK_REQUIRE_HTTPS: ${WEBHOOK_REQUIRE_HTTPS:-1}
    volumes:
      - ./:/var/www/html
    networks:
      - backend_net
    stop_grace_period: 30s

  # Large-scale file import worker. Its OWN container so parsing/pricing 1M-row uploads never
  # competes with the send worker or web requests. Claims import chunks atomically; multiple
  # import-worker containers are safe but not required.
  import-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ellsms-import-worker
    restart: unless-stopped
    command: php /var/www/html/cron/import-worker.php
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_VERSION: ${APP_VERSION:-}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-8}
      WORKER_JOB_LEASE_SECONDS: ${WORKER_JOB_LEASE_SECONDS:-300}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-5}
      JOB_RETRY_BASE_SECONDS: ${JOB_RETRY_BASE_SECONDS:-30}
      JOB_RETRY_MAX_SECONDS: ${JOB_RETRY_MAX_SECONDS:-1800}
      ELLSMS_MOCK_GATEWAY_ENABLED: ${ELLSMS_MOCK_GATEWAY_ENABLED:-0}
      IMPORT_CHUNK_SIZE: ${IMPORT_CHUNK_SIZE:-5000}
      DB_INSERT_BATCH: ${DB_INSERT_BATCH:-1000}
      IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:-2000000}
      IMPORT_MAX_UPLOAD_BYTES: ${IMPORT_MAX_UPLOAD_BYTES:-134217728}
      BACKEND_DB_HOST: ${BACKEND_DB_HOST:?set BACKEND_DB_HOST in .env}
      BACKEND_DB_PORT: ${BACKEND_DB_PORT:-3306}
      BACKEND_DB_NAME: ${BACKEND_DB_NAME:?set BACKEND_DB_NAME in .env}
      BACKEND_DB_USER: ${BACKEND_DB_USER:?set BACKEND_DB_USER in .env}
      BACKEND_DB_PASS: ${BACKEND_DB_PASS:?set BACKEND_DB_PASS in .env}
      BACKEND_DB_SSL_VERIFY: ${BACKEND_DB_SSL_VERIFY:-0}
      BACKEND_DB_SSL_CA: ${BACKEND_DB_SSL_CA:-}
    volumes:
      - ./:/var/www/html
    networks:
      - backend_net
    stop_grace_period: 30s

  # Delivery-status polling. Its OWN container for the same reason webhook-worker is: a provider
  # whose status API hangs must only ever delay other STATUS polls, never a scheduled send, an
  # auto-reply, or a bulk-send pass.
  #
  # This service is what makes delivery status update without an operator typing
  # `php cron/sms-status-poll.php` — that command still exists for a one-off pass and is safe to run
  # alongside this service (gateway_status_claim()'s compare-and-swap makes concurrent pollers safe,
  # exactly like every other claim in this project).
  status-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ellsms-status-worker
    restart: unless-stopped
    command: php /var/www/html/cron/sms-status-worker.php
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_VERSION: ${APP_VERSION:-}
      # How often to LOOK for due rows. Whether a row is actually due stays entirely with the
      # connector's own poll_initial_delay_seconds / poll_max_attempts / poll_max_age_seconds — this
      # interval never overrides them (see cron/sms-status-worker.php).
      SMS_GATEWAY_STATUS_WORKER_INTERVAL_SECONDS: ${SMS_GATEWAY_STATUS_WORKER_INTERVAL_SECONDS:-15}
      SMS_GATEWAY_STATUS_BATCH: ${SMS_GATEWAY_STATUS_BATCH:-100}
      SMS_GATEWAY_STATUS_REQUEST_MAX: ${SMS_GATEWAY_STATUS_REQUEST_MAX:-50}
      # The poller talks to providers through the same transport the send path uses, so it needs the
      # same transport switch — with SMS_GATEWAY_TRANSPORT unset it would never reach a gateway.
      SMS_GATEWAY_TRANSPORT: ${SMS_GATEWAY_TRANSPORT:-0}
      ELLSMS_MOCK_GATEWAY_ENABLED: ${ELLSMS_MOCK_GATEWAY_ENABLED:-0}
      BACKEND_DB_HOST: ${BACKEND_DB_HOST:?set BACKEND_DB_HOST in .env}
      BACKEND_DB_PORT: ${BACKEND_DB_PORT:-3306}
      BACKEND_DB_NAME: ${BACKEND_DB_NAME:?set BACKEND_DB_NAME in .env}
      BACKEND_DB_USER: ${BACKEND_DB_USER:?set BACKEND_DB_USER in .env}
      BACKEND_DB_PASS: ${BACKEND_DB_PASS:?set BACKEND_DB_PASS in .env}
      BACKEND_DB_SSL_VERIFY: ${BACKEND_DB_SSL_VERIFY:-0}
      BACKEND_DB_SSL_CA: ${BACKEND_DB_SSL_CA:-}
      API_BASE_URL: ${API_BASE_URL:-}
      BACKEND_SERVICE_ID: ${BACKEND_SERVICE_ID:-}
      BACKEND_SERVICE_SECRET: ${BACKEND_SERVICE_SECRET:-}
      # Provider-health alerts (issue #16) can fire from this process via issue #15's unified
      # alerting -- without these, a real outage detected here never reaches an admin.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_REPEAT_SECONDS_WARNING: ${ALERT_REPEAT_SECONDS_WARNING:-}
      ALERT_REPEAT_SECONDS_CRITICAL: ${ALERT_REPEAT_SECONDS_CRITICAL:-}
      ALERT_REPEAT_SECONDS_EMERGENCY: ${ALERT_REPEAT_SECONDS_EMERGENCY:-}
      ALERT_EMAIL_RECIPIENT: ${ALERT_EMAIL_RECIPIENT:-}
    volumes:
      - ./:/var/www/html
    networks:
      - backend_net
    # Health is "this worker's runtime is alive", deliberately NOT "the provider answers": a provider
    # outage must not mark the container unhealthy and have an orchestrator restart it in a loop —
    # the worker surviving provider failures is the whole point of its failure isolation.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Enough time to finish the current bounded pass and exit cleanly (SIGTERM handling in
    # cron/sms-status-worker.php) rather than being SIGKILLed mid-poll.
    stop_grace_period: 30s

  # Persistent report-summary/dimension-aggregation worker (issues #7/#12) -- 2026-09-02 final audit
  # finding: this cron script was documented as "a persistent worker" but had NO compose service to
  # actually run it continuously, so #7's report_summary_cache, #12's daily dimension summary, and
  # this re-audit's own send-dimension-log sidecar (app/Reports/SendDimensionLog.php) would never
  # populate in the documented deployment -- every report reading from them would stay empty
  # forever. Added rather than left as a documented gap, matching status-worker's own shape exactly.
  report-summary-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ellsms-report-summary-worker
    restart: unless-stopped
    command: php /var/www/html/cron/report-summary-worker.php
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_VERSION: ${APP_VERSION:-}
      REPORT_SUMMARY_WORKER_INTERVAL_SECONDS: ${REPORT_SUMMARY_WORKER_INTERVAL_SECONDS:-60}
      REPORT_SUMMARY_CHUNK_ROWS: ${REPORT_SUMMARY_CHUNK_ROWS:-5000}
      REPORT_SUMMARY_MAX_ROWS_PER_PASS: ${REPORT_SUMMARY_MAX_ROWS_PER_PASS:-50000}
      REPORT_SUMMARY_FULL_REBUILD_SECONDS: ${REPORT_SUMMARY_FULL_REBUILD_SECONDS:-3600}
      REPORT_DIMENSION_SUMMARY_CHUNK_ROWS: ${REPORT_DIMENSION_SUMMARY_CHUNK_ROWS:-5000}
      REPORT_DIMENSION_SUMMARY_MAX_ROWS_PER_PASS: ${REPORT_DIMENSION_SUMMARY_MAX_ROWS_PER_PASS:-50000}
      REPORT_DIMENSION_SUMMARY_FULL_REBUILD_SECONDS: ${REPORT_DIMENSION_SUMMARY_FULL_REBUILD_SECONDS:-3600}
      SEND_DIMENSION_LOG_CHUNK_ROWS: ${SEND_DIMENSION_LOG_CHUNK_ROWS:-5000}
      SEND_DIMENSION_LOG_MAX_ROWS_PER_PASS: ${SEND_DIMENSION_LOG_MAX_ROWS_PER_PASS:-50000}
      BACKEND_DB_HOST: ${BACKEND_DB_HOST:?set BACKEND_DB_HOST in .env}
      BACKEND_DB_PORT: ${BACKEND_DB_PORT:-3306}
      BACKEND_DB_NAME: ${BACKEND_DB_NAME:?set BACKEND_DB_NAME in .env}
      BACKEND_DB_USER: ${BACKEND_DB_USER:?set BACKEND_DB_USER in .env}
      BACKEND_DB_PASS: ${BACKEND_DB_PASS:?set BACKEND_DB_PASS in .env}
      BACKEND_DB_SSL_VERIFY: ${BACKEND_DB_SSL_VERIFY:-0}
      BACKEND_DB_SSL_CA: ${BACKEND_DB_SSL_CA:-}
    volumes:
      - ./:/var/www/html
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Enough time to finish the current bounded chunk and exit cleanly rather than being SIGKILLed
    # mid-aggregation (each chunk is its own atomic transaction, per docs/daily-metadata-aggregation.md,
    # so a hard kill can never corrupt the aggregate -- this is just to avoid discarding in-flight work).
    stop_grace_period: 30s

  # Active provider-health probing (issue #16) -- 2026-09-02 final audit finding: cron/provider-health-check.php
  # supports a --loop mode specifically so it can run as a persistent service, but had no compose
  # service either, so the "active" half of issue #16's passive+active health model never actually
  # ran in the documented deployment (passive recording from real dispatch still worked via
  # worker/status-worker/app). Strictly sequential, bounded-timeout TCP probes only -- touches no
  # resource the send workers use (see docs/provider-health-model.md), so it cannot contend with or
  # overload them.
  provider-health-checker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ellsms-provider-health-checker
    restart: unless-stopped
    command: php /var/www/html/cron/provider-health-check.php --loop
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_VERSION: ${APP_VERSION:-}
      PROVIDER_HEALTH_CHECK_INTERVAL_SECONDS: ${PROVIDER_HEALTH_CHECK_INTERVAL_SECONDS:-60}
      PROVIDER_HEALTH_CHECK_TIMEOUT_SECONDS: ${PROVIDER_HEALTH_CHECK_TIMEOUT_SECONDS:-3}
      PROVIDER_HEALTH_DEGRADED_THRESHOLD: ${PROVIDER_HEALTH_DEGRADED_THRESHOLD:-3}
      PROVIDER_HEALTH_DOWN_THRESHOLD: ${PROVIDER_HEALTH_DOWN_THRESHOLD:-5}
      PROVIDER_HEALTH_UP_MIN_SUCCESSES: ${PROVIDER_HEALTH_UP_MIN_SUCCESSES:-5}
      PROVIDER_HEALTH_RECOVERY_MIN_SUCCESSES: ${PROVIDER_HEALTH_RECOVERY_MIN_SUCCESSES:-2}
      PROVIDER_HEALTH_DEGRADED_LATENCY_MS: ${PROVIDER_HEALTH_DEGRADED_LATENCY_MS:-3000}
      PROVIDER_HEALTH_ALERT_COOLDOWN_SECONDS: ${PROVIDER_HEALTH_ALERT_COOLDOWN_SECONDS:-900}
      BACKEND_DB_HOST: ${BACKEND_DB_HOST:?set BACKEND_DB_HOST in .env}
      BACKEND_DB_PORT: ${BACKEND_DB_PORT:-3306}
      BACKEND_DB_NAME: ${BACKEND_DB_NAME:?set BACKEND_DB_NAME in .env}
      BACKEND_DB_USER: ${BACKEND_DB_USER:?set BACKEND_DB_USER in .env}
      BACKEND_DB_PASS: ${BACKEND_DB_PASS:?set BACKEND_DB_PASS in .env}
      BACKEND_DB_SSL_VERIFY: ${BACKEND_DB_SSL_VERIFY:-0}
      BACKEND_DB_SSL_CA: ${BACKEND_DB_SSL_CA:-}
      # Alerting (issue #15) fires from here on a DOWN/recovered transition.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_REPEAT_SECONDS_WARNING: ${ALERT_REPEAT_SECONDS_WARNING:-}
      ALERT_REPEAT_SECONDS_CRITICAL: ${ALERT_REPEAT_SECONDS_CRITICAL:-}
      ALERT_REPEAT_SECONDS_EMERGENCY: ${ALERT_REPEAT_SECONDS_EMERGENCY:-}
      ALERT_EMAIL_RECIPIENT: ${ALERT_EMAIL_RECIPIENT:-}
    volumes:
      - ./:/var/www/html
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 15s

  # Fake/Sandbox SMS gateway for development and load testing.
  # No external egress: it only answers the /send and /status endpoints.
  # It is reachable from other ELLSMS containers as http://ellsms-mock-sms-gateway:8080.
  mock-sms-gateway:
    build:
      context: .
      dockerfile: mock/Dockerfile
    container_name: ellsms-mock-sms-gateway
    restart: unless-stopped
    ports:
      - "${MOCK_SMS_PORT:-18080}:8080"
    environment:
      MOCK_SMS_SEED: ${MOCK_SMS_SEED:-12345}
      MOCK_SMS_MODE: ${MOCK_SMS_MODE:-success}
      MOCK_SMS_LATENCY_MS: ${MOCK_SMS_LATENCY_MS:-0}
    networks:
      - backend_net
    stop_grace_period: 5s

  # Phase 8 — prepares large report CSVs off the request path.
  #
  # Separate from worker/import-worker/status-worker for the same reason those are separate from
  # each other: an export is long, I/O-heavy and low-priority. A multi-million-row CSV must never
  # delay a scheduled send or a delivery-status poll, and a wedged export must not take the send
  # pipeline down with it.
  export-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ellsms-export-worker
    restart: unless-stopped
    command: php /var/www/html/cron/export-worker.php
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_VERSION: ${APP_VERSION:-}
      # How often to look for queued exports when the queue is empty. The worker does NOT sleep
      # between jobs while work remains, so a backlog drains at full speed.
      REPORT_EXPORT_WORKER_INTERVAL_SECONDS: ${REPORT_EXPORT_WORKER_INTERVAL_SECONDS:-10}
      # Rows per keyset page. This, not the total row count, is what bounds worker memory.
      EXPORT_CHUNK_ROWS: ${EXPORT_CHUNK_ROWS:-2000}
      # Lease held while exporting; a crashed worker's job becomes reclaimable after it expires.
      REPORT_EXPORT_LEASE_SECONDS: ${REPORT_EXPORT_LEASE_SECONDS:-900}
      # Hard ceiling so one runaway filter cannot fill the disk. Reaching it produces a clearly
      # marked truncated file rather than a silently short one.
      REPORT_EXPORT_MAX_ROWS: ${REPORT_EXPORT_MAX_ROWS:-2000000}
      # How long a finished export stays downloadable before the retention sweep deletes the file.
      REPORT_EXPORT_TTL_HOURS: ${REPORT_EXPORT_TTL_HOURS:-24}
      BACKEND_DB_HOST: ${BACKEND_DB_HOST:?set BACKEND_DB_HOST in .env}
      BACKEND_DB_PORT: ${BACKEND_DB_PORT:-3306}
      BACKEND_DB_NAME: ${BACKEND_DB_NAME:?set BACKEND_DB_NAME in .env}
      BACKEND_DB_USER: ${BACKEND_DB_USER:?set BACKEND_DB_USER in .env}
      BACKEND_DB_PASS: ${BACKEND_DB_PASS:?set BACKEND_DB_PASS in .env}
      BACKEND_DB_SSL_VERIFY: ${BACKEND_DB_SSL_VERIFY:-0}
      BACKEND_DB_SSL_CA: ${BACKEND_DB_SSL_CA:-}
    volumes:
      # The app container writes nothing here; this worker produces the files and public/report-exports.php
      # reads them back, so both need the same storage/ mount.
      - ./:/var/www/html
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 60s
      timeout: 5s
      retries: 3
    # Long enough to finish writing the current page and rename the file, so a stop never leaves a
    # half-written CSV behind.
    stop_grace_period: 30s

  # Issue #14 — Prometheus + Grafana observability stack. Behind the "observability" profile so a
  # plain `docker compose up` never starts them: bring them up explicitly with
  # `docker compose --profile observability up -d prometheus grafana`. Both stay on backend_net only
  # (Prometheus reaches `app:80/metrics` directly) and neither publishes a port to the host by
  # default beyond Grafana's own UI, which an operator is expected to put behind their own
  # auth/reverse-proxy before exposing outside a trusted network -- same posture as this compose
  # file already takes for the app's own APP_PORT.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ellsms-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ellsms_prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - backend_net
    depends_on:
      - app
      - node-exporter
      - cadvisor

  # Host CPU/RAM/disk/network (issue #14's own "Minimum coverage" list, closed 2026-09-02). Standard
  # off-the-shelf exporter -- deliberately not reimplemented in application code. Read-only bind
  # mounts of the host's own /proc, /sys, / -- never writes anything back.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: ellsms-node-exporter
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - backend_net

  # Per-container CPU/RAM/network/IO (same "Minimum coverage" item, the per-container half of it).
  # Read-only access to the Docker socket and host cgroup/filesystem info only -- never starts,
  # stops, or modifies a container.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ellsms-cadvisor
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend_net

  grafana:
    image: grafana/grafana:11.3.1
    container_name: ellsms-grafana
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards-files:ro
      - ellsms_grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - backend_net
    depends_on:
      - prometheus

networks:
  backend_net:
    external: true
    name: ${BACKEND_NETWORK:?set BACKEND_NETWORK in .env to the backend stack's Docker network name}

volumes:
  ellsms_prometheus_data:
  ellsms_grafana_data:
