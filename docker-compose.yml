services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ellsms-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-ellsms}
      DB_USER: ${DB_USER:-ellsms}
      DB_PASS: ${DB_PASS:-ellsms_secret}
      SMS_API_BASE: ${SMS_API_BASE:-https://rest.ravixops.com}
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ellsms-worker
    restart: unless-stopped
    command: php /var/www/html/cron/worker.php
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-ellsms}
      DB_USER: ${DB_USER:-ellsms}
      DB_PASS: ${DB_PASS:-ellsms_secret}
      SMS_API_BASE: ${SMS_API_BASE:-https://rest.ravixops.com}
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: ellsms-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ellsms}
      MYSQL_USER: ${DB_USER:-ellsms}
      MYSQL_PASSWORD: ${DB_PASS:-ellsms_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_secret_change_me}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASS:-root_secret_change_me}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional DB admin UI — remove in production or protect it.
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ellsms-pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      - db

volumes:
  dbdata:
