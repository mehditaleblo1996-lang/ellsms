########################################################################
# ELLSMS — connects to the SAME MySQL database as the negar-python
# project (network `negar_net`, container `negar-mysql`, database
# `negar`). This stack does NOT run its own MySQL — bring up the
# negar-python stack first so that network + database exist, then
# bring this one up.
########################################################################
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ellsms-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      NEGAR_DB_HOST: ${NEGAR_DB_HOST:-negar-mysql}
      NEGAR_DB_PORT: ${NEGAR_DB_PORT:-3306}
      NEGAR_DB_NAME: ${NEGAR_DB_NAME:-negar}
      NEGAR_DB_USER: ${NEGAR_DB_USER:-dbtest}
      NEGAR_DB_PASS: ${NEGAR_DB_PASS}
      VESAL_REST_URL: ${VESAL_REST_URL:-}
      VESAL_USERNAME: ${VESAL_USERNAME:-negar}
      VESAL_PASSWORD: ${VESAL_PASSWORD:-}
    volumes:
      - ./:/var/www/html
    networks:
      - negar_net

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ellsms-worker
    restart: unless-stopped
    command: php /var/www/html/cron/worker.php
    environment:
      NEGAR_DB_HOST: ${NEGAR_DB_HOST:-negar-mysql}
      NEGAR_DB_PORT: ${NEGAR_DB_PORT:-3306}
      NEGAR_DB_NAME: ${NEGAR_DB_NAME:-negar}
      NEGAR_DB_USER: ${NEGAR_DB_USER:-dbtest}
      NEGAR_DB_PASS: ${NEGAR_DB_PASS}
      VESAL_REST_URL: ${VESAL_REST_URL:-}
      VESAL_USERNAME: ${VESAL_USERNAME:-negar}
      VESAL_PASSWORD: ${VESAL_PASSWORD:-}
    volumes:
      - ./:/var/www/html
    networks:
      - negar_net

networks:
  negar_net:
    external: true   # created by negar-python's docker-compose.yml — bring that stack up first
