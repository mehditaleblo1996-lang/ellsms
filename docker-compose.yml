########################################################################
# ELLSMS — connects to the SAME MySQL database and Docker network as
# the connected backend SMS platform. This stack does NOT run its own
# MySQL — bring up the backend's own stack first so that its network
# and database already exist, then bring this one up.
#
# BACKEND_NETWORK must match the Docker network name the backend's own
# docker-compose.yml created (an "external" network here just means
# "already exists, created by someone else" — it is not published or
# owned by ELLSMS).
########################################################################
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ellsms-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      BACKEND_DB_HOST: ${BACKEND_DB_HOST:?set BACKEND_DB_HOST in .env}
      BACKEND_DB_PORT: ${BACKEND_DB_PORT:-3306}
      BACKEND_DB_NAME: ${BACKEND_DB_NAME:?set BACKEND_DB_NAME in .env}
      BACKEND_DB_USER: ${BACKEND_DB_USER:?set BACKEND_DB_USER in .env}
      BACKEND_DB_PASS: ${BACKEND_DB_PASS:?set BACKEND_DB_PASS in .env}
      API_BASE_URL: ${API_BASE_URL:-}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_CALLBACK_URL: ${ZARINPAL_CALLBACK_URL:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-0}
    volumes:
      - ./:/var/www/html
    networks:
      - backend_net

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ellsms-worker
    restart: unless-stopped
    command: php /var/www/html/cron/worker.php
    environment:
      BACKEND_DB_HOST: ${BACKEND_DB_HOST:?set BACKEND_DB_HOST in .env}
      BACKEND_DB_PORT: ${BACKEND_DB_PORT:-3306}
      BACKEND_DB_NAME: ${BACKEND_DB_NAME:?set BACKEND_DB_NAME in .env}
      BACKEND_DB_USER: ${BACKEND_DB_USER:?set BACKEND_DB_USER in .env}
      BACKEND_DB_PASS: ${BACKEND_DB_PASS:?set BACKEND_DB_PASS in .env}
      API_BASE_URL: ${API_BASE_URL:-}
    volumes:
      - ./:/var/www/html
    networks:
      - backend_net

networks:
  backend_net:
    external: true
    name: ${BACKEND_NETWORK:?set BACKEND_NETWORK in .env to the backend stack's Docker network name}
