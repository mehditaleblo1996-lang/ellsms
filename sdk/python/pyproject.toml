[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ellsms"
version = "1.0.0"
description = "Python client for the ELLSMS SMS panel public API (v1)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []
keywords = ["sms", "ellsms", "api", "iran"]

[tool.setuptools]
packages = ["ellsms"]
