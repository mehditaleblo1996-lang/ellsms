openapi: 3.0.3
info:
  title: Datis Rayan Public API
  version: "1.0"
  description: >
    Phase 12 public integration API. See docs/public-api.md and docs/webhooks.md for the full
    narrative reference — this document mirrors the implementation exactly and does not extend
    beyond what public/api/index.php actually routes.
servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: your-domain.example.com

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "ellsms_{live|test}_{prefix}_{secret}"

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    After:
      name: after
      in: query
      schema: { type: string }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, example: forbidden }
            message: { type: string }
            request_id: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

    Me:
      type: object
      properties:
        data:
          type: object
          properties:
            api_key_id: { type: integer }
            key_prefix: { type: string }
            environment: { type: string, enum: [live, test] }
            scopes: { type: array, items: { type: string } }
            organization_id: { type: integer }
            acting_user:
              type: object
              nullable: true
              properties:
                id: { type: integer }
                username: { type: string }

    Organization:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            slug: { type: string }
            status: { type: string, enum: [active, suspended, disabled] }

    MessageCreateRequest:
      type: object
      required: [destinations, content]
      properties:
        originator: { type: string }
        destinations:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 100
        content: { type: string, maxLength: 2000 }

    Message:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [sent, partially_sent, failed] }
            sent_count: { type: integer }
            total_count: { type: integer }
            originator: { type: string }
            destinations: { type: array, items: { type: string } }
            created_at: { type: string, format: date-time }

    BulkJobCreateRequest:
      type: object
      required: [type, title, items]
      properties:
        type: { type: string, enum: [p2p, smart, gradual] }
        title: { type: string }
        originator: { type: string }
        items:
          type: array
          items:
            type: object
            required: [mobile, content]
            properties:
              mobile: { type: string }
              content: { type: string }
        throttle_count: { type: integer, minimum: 1 }
        throttle_minutes: { type: integer, minimum: 1 }

    BulkJob:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string }
            type: { type: string }
            title: { type: string }
            status: { type: string, enum: [pending, processing, done] }
            sent_rows: { type: integer }
            failed_rows: { type: integer }
            total_rows: { type: integer }
            created_at: { type: string, format: date-time }

    Contact:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        mobile: { type: string }
        group: { type: string }
        created_at: { type: string, format: date-time }

    ContactWrite:
      type: object
      properties:
        mobile: { type: string }
        name: { type: string }
        group: { type: string }

    VoiceFile:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        source: { type: string, enum: [upload, tts] }
        duration_seconds: { type: integer, nullable: true }
        pulses: { type: integer, nullable: true, description: "ceil(duration / pulse length) — what one call of this file is priced in" }
        created_at: { type: string }

    VoiceMessage:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [voice, ivc, otp, otp2] }
        status: { type: string, enum: [scheduled, sending, sent, completed, failed, cancelled] }
        voice_file_id: { type: integer, nullable: true }
        title: { type: string }
        recipients: { type: integer }
        blocked: { type: integer, description: "numbers skipped because they are on the blacklist" }
        invalid: { type: integer, description: "POST /voice/messages only: numbers that were not valid mobiles" }
        pulses: { type: integer }
        unit_cost: { type: integer, description: Rial per recipient }
        reserved_cost: { type: integer, description: "Rial reserved when accepted (unit_cost × recipients)" }
        charged_cost: { type: integer, description: "Rial charged — answered calls only; final once status is completed" }
        answered: { type: integer }
        not_answered: { type: integer }
        scheduled_at: { type: string }
        sent_at: { type: string, nullable: true }
        completed_at: { type: string, nullable: true }
        created_at: { type: string }
        error: { type: string, nullable: true }

    Balance:
      type: object
      properties:
        data:
          type: object
          properties:
            available: { type: integer }
            reserved: { type: integer }
            total: { type: integer }
            unit: { type: string, example: IRR, description: "Balances are in Rial" }

    WebhookEndpoint:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        event_types: { type: array, items: { type: string } }
        consecutive_failures: { type: integer }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_failure_at: { type: string, format: date-time, nullable: true }
        disabled_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    WebhookEndpointCreateRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        description: { type: string }
        event_types:
          type: array
          items:
            type: string
            enum: [message.sent, message.failed, bulk.completed, bulk.failed, payment.credited]

paths:
  /me:
    get:
      summary: Authenticated key metadata
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        "401": { $ref: '#/components/responses/Unauthenticated' }

  /organization:
    get:
      summary: Caller's own organization
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } } }

  /messages:
    post:
      summary: Send a message (scope messages:send)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/MessageCreateRequest' } }
      responses:
        "201": { description: Sent (fully or partially), content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        "402": { description: Business rejection (e.g. insufficient credit), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "409": { $ref: '#/components/responses/IdempotencyConflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /messages/{id}:
    get:
      summary: Get a message (scope messages:read)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        "404": { $ref: '#/components/responses/NotFound' }

  /bulk-jobs:
    post:
      summary: Create a bulk send job (scope bulk:write)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/BulkJobCreateRequest' } }
      responses:
        "201": { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/BulkJob' } } } }
        "409": { $ref: '#/components/responses/IdempotencyConflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /bulk-jobs/{id}:
    get:
      summary: Bulk job status summary (scope bulk:read)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BulkJob' } } } }
        "404": { $ref: '#/components/responses/NotFound' }

  /contacts:
    get:
      summary: List contacts (scope contacts:read)
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/After' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Contact' } }
                  meta:
                    type: object
                    properties:
                      next_cursor: { type: string, nullable: true }
                      limit: { type: integer }
    post:
      summary: Create a contact (scope contacts:write)
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ContactWrite' } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Contact' } } } } } }
        "409": { description: "This mobile already exists in this group for the key's owner (code conflict)" }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /contacts/{id}:
    get:
      summary: Get a contact (scope contacts:read)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Contact' } } } } } }
        "404": { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a contact (scope contacts:write)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/ContactWrite' } }
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: "Another contact with this mobile already exists in this group (code conflict)" }
    delete:
      summary: Delete a contact (scope contacts:write)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /balance:
    get:
      summary: Wallet balance (scope balance:read)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Balance' } } } }

  /webhooks:
    get:
      summary: List webhook endpoints (scope webhooks:read)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/WebhookEndpoint' } } } }
    post:
      summary: Create a webhook endpoint (scope webhooks:write)
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/WebhookEndpointCreateRequest' } }
      responses:
        "201":
          description: Created — secret shown once
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { id: { type: string }, secret: { type: string } } } } }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /webhooks/{id}:
    get:
      summary: Get a webhook endpoint (scope webhooks:read)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/WebhookEndpoint' } } } } } }
        "404": { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a webhook endpoint (scope webhooks:write)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete (or disable, if it has delivery history) a webhook endpoint (scope webhooks:write)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: '#/components/responses/NotFound' }

  /webhooks/{id}/rotate-secret:
    post:
      summary: Rotate a webhook endpoint's signing secret (scope webhooks:write)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: New secret, shown once
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { id: { type: string }, secret: { type: string } } } } }
        "404": { $ref: '#/components/responses/NotFound' }

  /webhooks/{id}/test:
    post:
      summary: Queue a synthetic test event to this endpoint only (scope webhooks:write)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { event_id: { type: string }, note: { type: string } } } } }
        "404": { $ref: '#/components/responses/NotFound' }

  /voice/files:
    get:
      summary: List voice files (scope voice:read)
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/VoiceFile' } } } } } } }
        "503": { description: Voice service not enabled }

  /voice/tts:
    post:
      summary: Generate a voice file from text (scope voice:send)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 2000 }, title: { type: string }, speaker: { type: integer, description: "one of the speaker values configured on /admin/voice (ZarinCall's gender); default the first" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/VoiceFile' } } } } } }
        "402": { description: Insufficient credit }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /voice/messages:
    post:
      summary: Send a voice file to numbers, now or at scheduled_at (scope voice:send)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [voice_file_id, destinations]
              properties:
                voice_file_id: { type: integer }
                destinations: { type: array, maxItems: 10000, items: { type: string } }
                type: { type: string, enum: [voice, ivc], default: voice }
                ivc_digit: { type: integer, minimum: 0, maximum: 9, description: "type ivc: the key the recipient presses" }
                ivc_sms: { type: string, maxLength: 500, description: "type ivc: the SMS sent when the key is pressed" }
                scheduled_at: { type: string, format: date-time }
                title: { type: string }
                client_message_id: { type: string }
      responses:
        "201": { description: Accepted, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/VoiceMessage' } } } } } }
        "402": { description: Insufficient credit for the worst case }
        "404": { description: Unknown voice file }
        "409": { $ref: '#/components/responses/IdempotencyConflict' }
        "422": { $ref: '#/components/responses/ValidationFailed' }

  /voice/messages/{id}:
    get:
      summary: A voice message's status, answered / not answered calls and cost (scope voice:read)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/VoiceMessage' } } } } } }
        "404": { $ref: '#/components/responses/NotFound' }

  /voice/messages/{id}/cancel:
    post:
      summary: Cancel a scheduled voice message and release its reservation (scope voice:send)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Cancelled, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/VoiceMessage' } } } } } }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: Already started }

  /voice/otp:
    post:
      summary: Send a one-time code read out by phone (scope voice:send)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination, code]
              properties:
                destination: { type: string }
                code: { type: string, pattern: '^[0-9]{3,10}$' }
                voice_file_id: { type: integer, description: "optional announcement played before the code" }
                client_message_id: { type: string }
      responses:
        "201": { description: Sent, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/VoiceMessage' } } } } } }
        "402": { description: Insufficient credit }
        "422": { $ref: '#/components/responses/ValidationFailed' }
        "429": { description: The same number was called too recently }
        "502": { description: ZarinCall refused the call }

components:
  responses:
    Unauthenticated:
      description: Missing or invalid credentials
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found (including a cross-tenant id)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationFailed:
      description: Validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    IdempotencyConflict:
      description: Idempotency-Key reused with a different request body, or still processing
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
