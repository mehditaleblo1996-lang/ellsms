services:
  app:
    environment:
      AUDIT_MONGO_ENABLED: ${AUDIT_MONGO_ENABLED:-1}
      AUDIT_MONGO_DATABASE: ${AUDIT_MONGO_DATABASE:-ellsms_audit}
      AUDIT_MONGO_URI: "mongodb://${AUDIT_MONGO_USERNAME:-ellsms_audit}:${AUDIT_MONGO_PASSWORD:?set AUDIT_MONGO_PASSWORD in .env}@mongo:27017/${AUDIT_MONGO_DATABASE:-ellsms_audit}?authSource=admin"
    depends_on:
      - mongo

  mongo:
    # MongoDB 8.x currently refuses to start on Linux kernel 6.19+ because of a
    # TCMalloc/kernel incompatibility. Pin 6.0.27-jammy for this deployment until
    # the host kernel is upgraded to a fixed release. Do not use the floating 8.x tag here.
    image: mongo:6.0.27-jammy
    container_name: ellsms-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${AUDIT_MONGO_USERNAME:-ellsms_audit}
      MONGO_INITDB_ROOT_PASSWORD: ${AUDIT_MONGO_PASSWORD:?set AUDIT_MONGO_PASSWORD in .env}
    volumes:
      - ellsms_mongo_data:/data/db
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username '$${MONGO_INITDB_ROOT_USERNAME}' --password '$${MONGO_INITDB_ROOT_PASSWORD}' --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  ellsms_mongo_data:
