services:
  app:
    environment:
      MFA_MASTER_KEY: ${MFA_MASTER_KEY:-}
      SMS_GATEWAY_MASTER_KEY: ${SMS_GATEWAY_MASTER_KEY:-}
      # Business rule: all newly-issued invoices include 10% VAT.
      BILLING_TAX_PERCENT: 10
      AUDIT_MONGO_ENABLED: ${AUDIT_MONGO_ENABLED:-1}
      AUDIT_MONGO_DATABASE: ${AUDIT_MONGO_DATABASE:-ellsms_audit}
      AUDIT_MONGO_URI: "mongodb://${AUDIT_MONGO_USERNAME:-ellsms_audit}:${AUDIT_MONGO_PASSWORD:?set AUDIT_MONGO_PASSWORD in .env}@mongo:27017/${AUDIT_MONGO_DATABASE:-ellsms_audit}?authSource=admin"
    depends_on:
      - mongo

  worker:
    environment:
      BILLING_TAX_PERCENT: 10
      # Bulk/scheduled/direct-queue sends run here, so they MUST use the same
      # connector transport and secret vault as the web app. Without these,
      # a large send created by new-send.php silently switches transport when
      # it reaches the background worker.
      SMS_GATEWAY_TRANSPORT: ${SMS_GATEWAY_TRANSPORT:-0}
      SMS_GATEWAY_MASTER_KEY: ${SMS_GATEWAY_MASTER_KEY:-}

  import-worker:
    environment:
      # Generated direct sends are streamed in 10k-row batches. The persistent worker wakes every
      # second so the bounded insert-stage chunks do not add an artificial 8-second gap each.
      FAST_IMPORT_BATCH_SIZE: ${FAST_IMPORT_BATCH_SIZE:-10000}
      DB_INSERT_BATCH: ${DB_INSERT_BATCH:-5000}
      WORKER_POLL_INTERVAL_SECONDS: ${IMPORT_WORKER_POLL_INTERVAL_SECONDS:-1}
      # Pricing currently emits one metric call per recipient. Keep observability sampled for this
      # high-volume worker instead of writing 100k/500k near-identical log lines.
      METRICS_LOG_SAMPLE_RATE: ${IMPORT_METRICS_LOG_SAMPLE_RATE:-0.001}

  status-worker:
    environment:
      # Delivery polling compiles the same secret-backed gateway connector.
      SMS_GATEWAY_MASTER_KEY: ${SMS_GATEWAY_MASTER_KEY:-}

  mongo:
    # MongoDB 8.x currently refuses to start on Linux kernel 6.19+ because of a
    # TCMalloc/kernel incompatibility. Pin 6.0.27-jammy for this deployment until
    # the host kernel is upgraded to a fixed release. Do not use the floating 8.x tag here.
    image: mongo:6.0.27-jammy
    container_name: ellsms-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${AUDIT_MONGO_USERNAME:-ellsms_audit}
      MONGO_INITDB_ROOT_PASSWORD: ${AUDIT_MONGO_PASSWORD:?set AUDIT_MONGO_PASSWORD in .env}
    volumes:
      - ellsms_mongo_data:/data/db
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  ellsms_mongo_data:
