# ELLSMS canonical clean URL routing.
#
# Rules are intentionally centralized here instead of being scattered across PHP entrypoints.
# Public API and legacy /sms/url_send.html remain unchanged for compatibility.
# Old .php URLs are redirected only for GET/HEAD so POST form submissions keep working safely.

<Directory "${APACHE_DOCUMENT_ROOT}">
    RewriteEngine On
    CGIPassAuth On

    # ------------------------------------------------------------------
    # Existing infrastructure/API routes — compatibility contracts.
    # ------------------------------------------------------------------
    RewriteRule ^health/ready/?$ health-ready.php [L]
    RewriteRule ^health/?$ health.php [L]

    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^api/v1(/.*)?$ api/index.php [QSA,L]

    # ------------------------------------------------------------------
    # Canonical redirects: legacy GET/HEAD .php URLs -> clean URLs.
    # THE_REQUEST prevents redirect loops after an internal clean-url rewrite.
    # POST/PUT/PATCH/DELETE are never redirected here.
    # ------------------------------------------------------------------
    # Scheme of these redirects. Apache turns a redirect target into an absolute URL using the scheme
    # IT received, which is plain http behind the TLS-terminating proxy, so every legacy .php link
    # went https -> http -> https and Chrome's HTTPS-First mode stopped on the downgrade with "This
    # site doesn't support a secure connection". https when the proxy says so (X-Forwarded-Proto, or
    # Cloudflare's CF-Visitor, which survives a local nginx that rewrites X-Forwarded-Proto to its own
    # http hop) or APP_URL is https, otherwise the request's own scheme (local http installs). Only
    # ever picks the scheme of a same-host redirect, so a spoofed header can only affect the sender's
    # own redirect.
    RewriteRule ^ - [E=CANON_SCHEME:%{REQUEST_SCHEME}]
    RewriteCond %{HTTP:X-Forwarded-Proto} ^https [NC,OR]
    RewriteCond %{HTTP:CF-Visitor} scheme\W{1,6}https [NC,OR]
    RewriteCond "x${APP_URL}" ^xhttps:// [NC]
    RewriteRule ^ - [E=CANON_SCHEME:https]

    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+index\.php(?:[?\s]) [NC]
    RewriteRule ^index\.php$ %{ENV:CANON_SCHEME}://%{HTTP_HOST}/dashboard [R=301,L,NE]

