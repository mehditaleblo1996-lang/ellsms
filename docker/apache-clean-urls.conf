# ELLSMS canonical clean URL routing.
#
# Rules are intentionally centralized here instead of being scattered across PHP entrypoints.
# Public API and legacy /sms/url_send.html remain unchanged for compatibility.
# Old .php URLs are redirected only for GET/HEAD so POST form submissions keep working safely.

<Directory "${APACHE_DOCUMENT_ROOT}">
    RewriteEngine On
    CGIPassAuth On

    # ------------------------------------------------------------------
    # Existing infrastructure/API routes — compatibility contracts.
    # ------------------------------------------------------------------
    RewriteRule ^health/ready/?$ health-ready.php [L]
    RewriteRule ^health/?$ health.php [L]

    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^api/v1(/.*)?$ api/index.php [QSA,L]

    # ------------------------------------------------------------------
    # Canonical redirects: legacy GET/HEAD .php URLs -> clean URLs.
    # THE_REQUEST prevents redirect loops after an internal clean-url rewrite.
    # POST/PUT/PATCH/DELETE are never redirected here.
    # ------------------------------------------------------------------
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+index\.php(?:[?\s]) [NC]
    RewriteRule ^index\.php$ /dashboard [R=301,L,NE]

    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+landing\.php(?:[?\s]) [NC]
    RewriteRule ^landing\.php$ / [R=301,L,NE]

    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+login\.php(?:[?\s]) [NC]
    RewriteRule ^login\.php$ /login [R=301,L,NE]

    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+logout\.php(?:[?\s]) [NC]
    RewriteRule ^logout\.php$ /logout [R=301,L,NE]

    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+verify-2fa\.php(?:[?\s]) [NC]
    RewriteRule ^verify-2fa\.php$ /login/verify-2fa [R=301,L,NE]

    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+register\.php(?:[?\s]) [NC]
    RewriteRule ^register\.php$ /register [R=301,L,NE]

    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+register-verify\.php(?:[?\s]) [NC]
    RewriteRule ^register-verify\.php$ /register/verify [R=301,L,NE]

    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+register-pending\.php(?:[?\s]) [NC]
    RewriteRule ^register-pending\.php$ /register/pending [R=301,L,NE]

    # Generic one-to-one canonical redirects.
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+pricing\.php(?:[?\s]) [NC]
    RewriteRule ^pricing\.php$ /pricing [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+guide\.php(?:[?\s]) [NC]
    RewriteRule ^guide\.php$ /guide [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+contact\.php(?:[?\s]) [NC]
    RewriteRule ^contact\.php$ /contact [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+onboarding\.php(?:[?\s]) [NC]
    RewriteRule ^onboarding\.php$ /onboarding [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+notifications\.php(?:[?\s]) [NC]
    RewriteRule ^notifications\.php$ /notifications [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+profile\.php(?:[?\s]) [NC]
    RewriteRule ^profile\.php$ /account/profile [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+organizations\.php(?:[?\s]) [NC]
    RewriteRule ^organizations\.php$ /account/organizations [R=301,L,NE]

    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+new-send\.php(?:[?\s]) [NC]
    RewriteRule ^new-send\.php$ /messages/new [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+send\.php(?:[?\s]) [NC]
    RewriteRule ^send\.php$ /messages/send [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+p2p-send\.php(?:[?\s]) [NC]
    RewriteRule ^p2p-send\.php$ /messages/p2p [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+smart-send\.php(?:[?\s]) [NC]
    RewriteRule ^smart-send\.php$ /messages/smart [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+schedules\.php(?:[?\s]) [NC]
    RewriteRule ^schedules\.php$ /messages/schedules [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+autoreply\.php(?:[?\s]) [NC]
    RewriteRule ^autoreply\.php$ /messages/autoreply [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+import\.php(?:[?\s]) [NC]
    RewriteRule ^import\.php$ /contacts/import [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+import-confirm\.php(?:[?\s]) [NC]
    RewriteRule ^import-confirm\.php$ /contacts/import/confirm [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+import-status\.php(?:[?\s]) [NC]
    RewriteRule ^import-status\.php$ /contacts/import/status [R=301,L,NE]

    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+reports\.php(?:[?\s]) [NC]
    RewriteRule ^reports\.php$ /messages/reports [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+report-exports\.php(?:[?\s]) [NC]
    RewriteRule ^report-exports\.php$ /messages/reports/exports [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+inbox\.php(?:[?\s]) [NC]
    RewriteRule ^inbox\.php$ /messages/inbox [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+contacts\.php(?:[?\s]) [NC]
    RewriteRule ^contacts\.php$ /contacts [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+blacklist\.php(?:[?\s]) [NC]
    RewriteRule ^blacklist\.php$ /contacts/blacklist [R=301,L,NE]

    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+buy-credit\.php(?:[?\s]) [NC]
    RewriteRule ^buy-credit\.php$ /billing/credit [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+invoices\.php(?:[?\s]) [NC]
    RewriteRule ^invoices\.php$ /billing/invoices [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+billing\.php(?:[?\s]) [NC]
    RewriteRule ^billing\.php$ /billing [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+api-keys\.php(?:[?\s]) [NC]
    RewriteRule ^api-keys\.php$ /developers/api-keys [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+webhooks\.php(?:[?\s]) [NC]
    RewriteRule ^webhooks\.php$ /developers/webhooks [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+tickets\.php(?:[?\s]) [NC]
    RewriteRule ^tickets\.php$ /support/tickets [R=301,L,NE]

    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+users\.php(?:[?\s]) [NC]
    RewriteRule ^users\.php$ /admin/users [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+user-send-policies\.php(?:[?\s]) [NC]
    RewriteRule ^user-send-policies\.php$ /admin/users/send-policies [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+impersonate\.php(?:[?\s]) [NC]
    RewriteRule ^impersonate\.php$ /admin/impersonate [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+registration-requests\.php(?:[?\s]) [NC]
    RewriteRule ^registration-requests\.php$ /admin/registrations [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+kyc-review\.php(?:[?\s]) [NC]
    RewriteRule ^kyc-review\.php$ /admin/kyc/review [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+kyc-gates\.php(?:[?\s]) [NC]
    RewriteRule ^kyc-gates\.php$ /admin/kyc/gates [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+analytics\.php(?:[?\s]) [NC]
    RewriteRule ^analytics\.php$ /admin/analytics [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+logs\.php(?:[?\s]) [NC]
    RewriteRule ^logs\.php$ /admin/logs [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+numbers\.php(?:[?\s]) [NC]
    RewriteRule ^numbers\.php$ /admin/numbers [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+number-categories\.php(?:[?\s]) [NC]
    RewriteRule ^number-categories\.php$ /admin/numbers/categories [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+sms-pricing\.php(?:[?\s]) [NC]
    RewriteRule ^sms-pricing\.php$ /admin/sms/pricing [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+sms-gateways\.php(?:[?\s]) [NC]
    RewriteRule ^sms-gateways\.php$ /admin/sms/gateways [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+sms-gateway-clone\.php(?:[?\s]) [NC]
    RewriteRule ^sms-gateway-clone\.php$ /admin/sms/gateways/clone [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+queue-cancellation\.php(?:[?\s]) [NC]
    RewriteRule ^queue-cancellation\.php$ /admin/queue/cancellation [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+bulk-archive\.php(?:[?\s]) [NC]
    RewriteRule ^bulk-archive\.php$ /admin/bulk-archive [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+billing-admin\.php(?:[?\s]) [NC]
    RewriteRule ^billing-admin\.php$ /admin/billing/plans [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+financial-admin\.php(?:[?\s]) [NC]
    RewriteRule ^financial-admin\.php$ /admin/billing/finance [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+guide-admin\.php(?:[?\s]) [NC]
    RewriteRule ^guide-admin\.php$ /admin/content/guide [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+slides\.php(?:[?\s]) [NC]
    RewriteRule ^slides\.php$ /admin/content/slides [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+settings\.php(?:[?\s]) [NC]
    RewriteRule ^settings\.php$ /admin/settings [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+bootstrap-admin\.php(?:[?\s]) [NC]
    RewriteRule ^bootstrap-admin\.php$ /admin/bootstrap [R=301,L,NE]

    # Detail URLs with existing query parameters. Keep query parameters intact for
    # backward compatibility; the clean path becomes canonical for new links.
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+message-detail\.php(?:[?\s]) [NC]
    RewriteRule ^message-detail\.php$ /messages/detail [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+registration-request\.php(?:[?\s]) [NC]
    RewriteRule ^registration-request\.php$ /admin/registrations/detail [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+profile-document\.php(?:[?\s]) [NC]
    RewriteRule ^profile-document\.php$ /account/profile/document [R=301,L,NE]
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{THE_REQUEST} \s/+kyc-photo\.php(?:[?\s]) [NC]
    RewriteRule ^kyc-photo\.php$ /account/kyc/photo [R=301,L,NE]

    # Payment callback is intentionally NOT externally redirected: providers may POST
    # and callbacks must remain stable. /payments/zarinpal/callback is an additional alias.

    # ------------------------------------------------------------------
    # Clean URL -> existing PHP entrypoint rewrites.
    # ------------------------------------------------------------------
    RewriteRule ^$ landing.php [QSA,L]
    RewriteRule ^dashboard/?$ index.php [QSA,L]
    RewriteRule ^login/?$ login.php [QSA,L]
    RewriteRule ^logout/?$ logout.php [QSA,L]
    RewriteRule ^login/verify-2fa/?$ verify-2fa.php [QSA,L]
    RewriteRule ^register/?$ register.php [QSA,L]
    RewriteRule ^register/verify/?$ register-verify.php [QSA,L]
    RewriteRule ^register/pending/?$ register-pending.php [QSA,L]
    RewriteRule ^pricing/?$ pricing.php [QSA,L]
    RewriteRule ^guide/?$ guide.php [QSA,L]
    RewriteRule ^contact/?$ contact.php [QSA,L]
    RewriteRule ^onboarding/?$ onboarding.php [QSA,L]
    RewriteRule ^notifications/?$ notifications.php [QSA,L]
    RewriteRule ^account/profile/?$ profile.php [QSA,L]
    RewriteRule ^account/profile/document/?$ profile-document.php [QSA,L]
    RewriteRule ^account/kyc/photo/?$ kyc-photo.php [QSA,L]
    RewriteRule ^account/organizations/?$ organizations.php [QSA,L]

    RewriteRule ^messages/new/?$ new-send.php [QSA,L]
    RewriteRule ^messages/send/?$ send.php [QSA,L]
    RewriteRule ^messages/p2p/?$ p2p-send.php [QSA,L]
    RewriteRule ^messages/smart/?$ smart-send.php [QSA,L]
    RewriteRule ^messages/schedules/?$ schedules.php [QSA,L]
    RewriteRule ^messages/autoreply/?$ autoreply.php [QSA,L]
    RewriteRule ^messages/reports/?$ reports.php [QSA,L]
    RewriteRule ^messages/reports/exports/?$ report-exports.php [QSA,L]
    RewriteRule ^messages/reports/bulk/?$ reports-bulk.php [QSA,L]
    RewriteRule ^messages/bulk-jobs/?$ bulk-job.php [QSA,L]
    RewriteRule ^messages/inbox/?$ inbox.php [QSA,L]
    RewriteRule ^messages/detail/?$ message-detail.php [QSA,L]

    RewriteRule ^contacts/?$ contacts.php [QSA,L]
    RewriteRule ^contacts/blacklist/?$ blacklist.php [QSA,L]
    RewriteRule ^contacts/import/?$ import.php [QSA,L]
    RewriteRule ^contacts/import/confirm/?$ import-confirm.php [QSA,L]
    RewriteRule ^contacts/import/status/?$ import-status.php [QSA,L]

    RewriteRule ^billing/?$ billing.php [QSA,L]
    RewriteRule ^billing/credit/?$ buy-credit.php [QSA,L]
    RewriteRule ^billing/invoices/?$ invoices.php [QSA,L]
    RewriteRule ^payments/zarinpal/callback/?$ zarinpal-callback.php [QSA,L]

    RewriteRule ^developers/api-keys/?$ api-keys.php [QSA,L]
    RewriteRule ^developers/webhooks/?$ webhooks.php [QSA,L]
    RewriteRule ^support/tickets/?$ tickets.php [QSA,L]

    RewriteRule ^admin/users/?$ users.php [QSA,L]
    RewriteRule ^admin/users/send-policies/?$ user-send-policies.php [QSA,L]
    RewriteRule ^admin/impersonate/?$ impersonate.php [QSA,L]
    RewriteRule ^admin/registrations/?$ registration-requests.php [QSA,L]
    RewriteRule ^admin/registrations/detail/?$ registration-request.php [QSA,L]
    RewriteRule ^admin/kyc/review/?$ kyc-review.php [QSA,L]
    RewriteRule ^admin/kyc/gates/?$ kyc-gates.php [QSA,L]
    RewriteRule ^admin/analytics/?$ analytics.php [QSA,L]
    RewriteRule ^admin/logs/?$ logs.php [QSA,L]
    RewriteRule ^admin/numbers/?$ numbers.php [QSA,L]
    RewriteRule ^admin/numbers/categories/?$ number-categories.php [QSA,L]
    RewriteRule ^admin/sms/pricing/?$ sms-pricing.php [QSA,L]
    RewriteRule ^admin/sms/gateways/?$ sms-gateways.php [QSA,L]
    RewriteRule ^admin/sms/gateways/clone/?$ sms-gateway-clone.php [QSA,L]
    RewriteRule ^admin/queue/cancellation/?$ queue-cancellation.php [QSA,L]
    RewriteRule ^admin/bulk-archive/?$ bulk-archive.php [QSA,L]
    RewriteRule ^admin/billing/plans/?$ billing-admin.php [QSA,L]
    RewriteRule ^admin/billing/finance/?$ financial-admin.php [QSA,L]
    RewriteRule ^admin/content/guide/?$ guide-admin.php [QSA,L]
    RewriteRule ^admin/content/slides/?$ slides.php [QSA,L]
    RewriteRule ^admin/settings/?$ settings.php [QSA,L]
    RewriteRule ^admin/bootstrap/?$ bootstrap-admin.php [QSA,L]
</Directory>
