name: Issue 24 verification

on:
  push:
    branches: [main]
    paths:
      - 'app/AllowedIps.php'
      - 'public/api/index.php'
      - 'public/api-keys.php'
      - 'tests/Unit/AllowedIpsTest.php'
      - 'tests/Integration/AllowedIpEnforcementIntegrationTest.php'
      - '.github/workflows/issue-24-verification.yml'
  workflow_dispatch:

jobs:
  allowed-ip-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ellsms_test
          MYSQL_USER: ellsms_test
          MYSQL_PASSWORD: ellsms_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ELLSMS_TEST_DB_HOST: 127.0.0.1
      ELLSMS_TEST_DB_PORT: 3306
      ELLSMS_TEST_DB_NAME: ellsms_test
      ELLSMS_TEST_DB_USER: ellsms_test
      ELLSMS_TEST_DB_PASS: ellsms_test
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: |
          php -l app/AllowedIps.php
          php -l public/api/index.php
          php -l public/api-keys.php
          php -l tests/Unit/AllowedIpsTest.php
          php -l tests/Integration/AllowedIpEnforcementIntegrationTest.php
      - name: Issue 24 PHPUnit coverage
        run: vendor/bin/phpunit tests/Unit/AllowedIpsTest.php tests/Integration/AllowedIpEnforcementIntegrationTest.php
