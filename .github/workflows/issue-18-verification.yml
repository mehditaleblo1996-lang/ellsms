name: Issue 18 verification

on:
  push:
    branches: [main]
    paths:
      - 'app/Sms/GatewayTransport.php'
      - 'db/migrations/2026_09_16_provider_response_normalization.sql'
      - 'tests/Unit/ProviderResponseNormalizerTest.php'
      - 'tests/Integration/ProviderResponseAuditIntegrationTest.php'
      - '.github/workflows/issue-18-verification.yml'
  workflow_dispatch:

jobs:
  provider-response-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ellsms_test
          MYSQL_USER: ellsms_test
          MYSQL_PASSWORD: ellsms_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ELLSMS_TEST_DB_HOST: 127.0.0.1
      ELLSMS_TEST_DB_PORT: 3306
      ELLSMS_TEST_DB_NAME: ellsms_test
      ELLSMS_TEST_DB_USER: ellsms_test
      ELLSMS_TEST_DB_PASS: ellsms_test
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: |
          php -l app/Sms/GatewayTransport.php
          php -l tests/Unit/ProviderResponseNormalizerTest.php
          php -l tests/Integration/ProviderResponseAuditIntegrationTest.php
      - name: Full PHPUnit regression suite
        run: vendor/bin/phpunit
